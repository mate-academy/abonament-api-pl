# Lokalne środowisko testowe: abonament-api na localhost:3000, Postgres z danymi testowymi, catalog-api z rezerwacjami.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  catalog-api:
    image: node:22-slim
    command: ["node", "/stub/server.mjs"]
    volumes:
      - ./stand/catalog-api:/stub:ro

  abonament-api:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:test@postgres:5432/postgres
      CATALOG_API_URL: http://catalog-api:4000
      CLOCK_FIXED_NOW: 2026-11-03T09:00:00Z
      LIBRARIAN_TOKEN: librarian-local-token
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-api:
        condition: service_started
